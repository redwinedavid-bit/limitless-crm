<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Limitless | Technician</title><link rel="stylesheet" href="/styles.css">
<style>
body{background:#14252b;color:#e9f4f4}.tech-main{max-width:760px;margin:auto;padding:22px 14px}.tech-main h1{font-size:28px}.tech-main h2{font-size:21px;overflow-wrap:anywhere}.tech-job,#active-clock{border:1px solid #35565d;border-radius:14px;padding:19px;margin:18px 0;background:#213d43}.tech-main label{display:grid;gap:7px;margin:15px 0}.tech-main input,.tech-main select,.tech-main textarea{width:100%;min-width:0;box-sizing:border-box;padding:12px;border-radius:7px;border:1px solid #90a9ad;background:#fff;color:#20323a;font-size:16px;min-height:46px}.tech-main textarea{min-height:110px}.tech-main button,.tech-main .field-link{min-height:46px;padding:12px 16px;border-radius:8px;touch-action:manipulation}.tech-main button:not(.outline){background:#147c84;color:white;border:1px solid #319ca4}.tech-main .outline{color:#e9f4f4;border:1px solid #79a5ab;background:transparent}.clock-actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.clock-actions button{flex:1;min-width:140px}.clock-help,.tech-job small{color:#b2ccd0;font-size:13px;line-height:1.5}#clock-elapsed{font-size:38px;letter-spacing:2px;display:block;font-variant-numeric:tabular-nums}.clock-error,#clock-review{color:#ffcf95;line-height:1.5}.clock-success{color:#7fdfcf;line-height:1.5}.tech-main details{border-top:1px solid #527077;margin-top:18px;padding-top:14px}.tech-main summary{min-height:42px;cursor:pointer;padding:10px 0;font-weight:700}.field-link{display:block;text-align:center;text-decoration:none;margin:15px 0}.time-history p{padding:12px 0;border-bottom:1px solid #527077;line-height:1.7}.tech-main pre{white-space:pre-wrap;overflow-wrap:anywhere}.tech-main button:disabled{cursor:wait;opacity:.5}
</style></head><body><main class="tech-main"><div class="eyebrow" style="color:#59bbbd">LIMITLESS MECHANICAL</div><h1>My Service Jobs</h1><p id="who">Loading assignments…</p><section id="active-clock" aria-label="Time clock"><p>Loading clock status…</p></section><p id="clock-feedback" role="status" aria-live="polite"></p><p id="clock-review" role="status"></p><button class="outline" id="refresh-clock">Refresh clock</button><section id="jobs"></section><button class="outline" id="logout">Sign out</button></main><script src="/field-offline.js"></script><script src="/tech.js"></script></body></html>
